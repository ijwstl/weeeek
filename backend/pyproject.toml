[project]
name = "weeeek-backend"
version = "0.1.0"
description = "Backend service for Weeeek reporting platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.3",
    "celery>=5.4.0",
    "cryptography>=43.0.1",
    "fastapi>=0.115.0",
    "ldap3>=2.9.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.2",
    "pydantic-settings>=2.5.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "redis>=5.1.1",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
